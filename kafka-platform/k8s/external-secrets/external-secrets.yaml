apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: kafka
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: kafka
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/external-secrets-role
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-admin-secret
  namespace: kafka
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: kafka-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kafka/admin/password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-connect-secret
  namespace: kafka
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: kafka-connect
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kafka/connect/password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: schema-registry-secret
  namespace: kafka
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: schema-registry-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: kafka/schema-registry
