apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: kafka-connect
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 3.6.0
  replicas: 3
  
  bootstrapServers: prod-kafka-kafka-bootstrap:9092
  
  tls:
    trustedCertificates:
      - secretName: prod-kafka-cluster-ca-cert
        certificate: ca.crt
  
  authentication:
    type: scram-sha-512
    username: kafka-connect
    passwordSecret:
      secretName: kafka-connect
      password: password
  
  config:
    group.id: kafka-connect-cluster
    offset.storage.topic: connect-cluster-offsets
    offset.storage.replication.factor: 3
    config.storage.topic: connect-cluster-configs
    config.storage.replication.factor: 3
    status.storage.topic: connect-cluster-status
    status.storage.replication.factor: 3
    
    # Converter settings
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
    
    # Consumer settings
    consumer.max.poll.records: 500
    consumer.max.poll.interval.ms: 300000
    
    # Producer settings
    producer.compression.type: snappy
    producer.max.in.flight.requests.per.connection: 5
    producer.enable.idempotence: true
  
  resources:
    requests:
      memory: 2Gi
      cpu: "1000m"
    limits:
      memory: 4Gi
      cpu: "2000m"
  
  jvmOptions:
    -Xms: 1024m
    -Xmx: 2048m
  
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: kafka-metrics
        key: kafka-connect-metrics.yaml
  
  # Build configuration for custom connectors
  build:
    output:
      type: docker
      image: kafka-connect:latest
    plugins:
      - name: debezium-postgres-connector
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/2.4.0.Final/debezium-connector-postgres-2.4.0.Final-plugin.tar.gz
      - name: confluentinc-kafka-connect-s3
        artifacts:
          - type: zip
            url: https://d1i4a15mxbxib1.cloudfront.net/api/plugins/confluentinc/kafka-connect-s3/versions/10.5.0/confluentinc-kafka-connect-s3-10.5.0.zip
---
# Example connector configuration
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: s3-sink-connector
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-connect
spec:
  class: io.confluent.connect.s3.S3SinkConnector
  tasksMax: 3
  config:
    topics: orders,payments
    s3.bucket.name: kafka-data-lake
    s3.region: us-east-1
    flush.size: 10000
    rotate.interval.ms: 3600000
    storage.class: io.confluent.connect.s3.storage.S3Storage
    format.class: io.confluent.connect.s3.format.json.JsonFormat
    partitioner.class: io.confluent.connect.storage.partitioner.TimeBasedPartitioner
    path.format: "'year'=YYYY/'month'=MM/'day'=dd/'hour'=HH"
    partition.duration.ms: 3600000
    timezone: UTC
